aid: chase
name: Chase
description: >-
  JPMorgan Chase Bank, N.A. is a leading US financial institution providing consumer and commercial banking, credit
  cards, mortgages, and merchant services. The Chase Developer Portal exposes APIs for FDX-aligned account aggregation,
  customer consent, rewards balances, and the Loyalty Pay with Points platform that lets enrolled merchants and partners
  enable customers to redeem Ultimate Rewards points at checkout.
