openapi: 3.2.0
info:
  title: Chase Loyalty Pay with Points Order Service Refunds API
  description: Order service that lets merchants redeem Chase Ultimate Rewards points against purchases. Supports order creation, capture, refund, and reversal flows.
  version: '1.0'
  contact:
    name: Chase Developer Support
    url: https://developer.chase.com/support
servers:
- url: https://api.chase.com/loyalty/pay-with-points/orders
  description: Pay with Points Production
security:
- oauth2: []
tags:
- name: Refunds
paths:
  /orders/{orderId}/refunds:
    post:
      operationId: refundOrder
      summary: Refund a Pay with Points order
      tags:
      - Refunds
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                reason:
                  type: string
      responses:
        '201':
          description: Refund issued
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.chase.com/oauth2/token
          scopes:
            orders.write: Create and modify orders
